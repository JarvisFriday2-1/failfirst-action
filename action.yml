name: FailFirst
description: Prove a pull request's tests fail on base, pass on head, and fail again with the fix reverted; scan the diff for weakened tests.
author: John Vavalo
branding:
  icon: shield
  color: red
inputs:
  base:
    description: Base ref or SHA to compare against.
    default: ${{ github.event.pull_request.base.sha }}
  test-command:
    description: Test command to run; defaults to the one in failfirst.config.json or npm test.
    default: ""
  version:
    description: Version of the fail-first-gate npm package to run.
    default: "0.1.1"
  node-version:
    description: Node.js version to set up (fail-first-gate needs 22 or newer).
    default: "22"
runs:
  using: composite
  steps:
    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
    - name: FailFirst check + scan
      shell: bash
      working-directory: ${{ github.action_path }}
      env:
        FAILFIRST_REPO: ${{ github.workspace }}
      run: bash run.sh --base "${{ inputs.base }}" --test-command "${{ inputs.test-command }}" --version "${{ inputs.version }}"
